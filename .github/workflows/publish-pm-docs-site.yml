name: Publish pm-docs-site

# Modelled on purview-dev/astroc4's release.yml: trusted publishing, idempotent,
# and the publish before the tag. The package is versioned on its own by
# `version` in packages/pm-docs-site/package.json; the repository's root
# package.json versions the skills (release.yml, tags v{version}), so this
# package's tag is pm-docs-site-v{version}.

on:
  push:
    branches: [main]
    # A release is driven by a version bump, so the pipeline only wakes when the
    # package's package.json changes.
    paths:
      - packages/pm-docs-site/package.json
  # Manual re-run for whatever version is on the branch. Every step is
  # idempotent: the eligibility step skips a tagged version, and the publish
  # step skips a version already on the registry.
  workflow_dispatch:

# Serialize releases: two runs must never both decide a version is untagged.
concurrency:
  group: publish-pm-docs-site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE: '@purview-dev/pm-docs-site'
  TAG_PREFIX: pm-docs-site-v

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The GitHub environment `npm` keeps a deployment record per release and
    # restricts the job to protected branches. There is no reviewer gate: the
    # branch protection on main is the checkpoint, and the job is idempotent.
    environment:
      name: npm
    permissions:
      # Push the tag and create the GitHub release after the publish.
      contents: write
      # npm trusted publishing. The registry exchanges this OIDC token for a
      # short-lived publish credential, so no npm token is stored anywhere.
      id-token: write
    defaults:
      run:
        working-directory: packages/pm-docs-site
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Every tag, so the eligibility check sees the released versions.
          fetch-depth: 0

      # The release eligibility rules of purview-dev/build's shared release
      # workflow, which cannot run here: it reads the root package.json and
      # tags v{version}, and both belong to the skills.
      #   REL001 the version is SemVer.
      #   REL002 pm-docs-site-v{version} is not tagged; a tagged version is
      #          released, so the run skips, green.
      #   REL003 a stable version is published only from main.
      # Tags are written only by this workflow, never by hand: a hand-pushed tag
      # makes the release of that version skip.
      - name: Check release eligibility
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          PRIVATE="$(node -p "require('./package.json').private === true")"
          TAG="${TAG_PREFIX}${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Read ${PACKAGE} ${VERSION} from package.json."

          if ! [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::REL001: ${VERSION} is not SemVer (MAJOR.MINOR.PATCH, optionally -<prerelease>)."
            exit 1
          fi

          # A prerelease must not take the `latest` dist-tag on publish, or it
          # becomes what every bare `bun add @purview-dev/pm-docs-site` installs.
          case "${VERSION}" in
            *-*) echo "dist-tag=prerelease" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::REL002: tag ${TAG} already exists, so ${VERSION} is released; nothing to publish."
            exit 0
          fi

          if [[ "${VERSION}" != *-* && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::REL003: the stable version ${VERSION} is published only from main, not ${GITHUB_REF}."
            exit 1
          fi

          if [ "${PRIVATE}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${PACKAGE} is private in package.json; nothing to publish. Remove \"private\" to publish it."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Eligible: ${PACKAGE} ${VERSION} under the ${TAG} tag."

      - name: Set up Bun
        if: steps.version.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The package's builds need Node 24 or later, and trusted publishing an npm
      # CLI that Node 24 can install. Deliberately no `registry-url`: setup-node
      # would write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into
      # .npmrc, and with no token defined that placeholder is the one thing that
      # would stand between npm and the OIDC exchange.
      - name: Set up Node
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        if: steps.version.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      # Never publish something that does not pass its own suite. `bun test`
      # includes a build from the packed tarball installed outside the repository.
      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: bun test

      - name: Type-check
        if: steps.version.outputs.skip != 'true'
        run: bun run check

      # Emits dist/, the JavaScript Node loads from the installed package. npm
      # publish builds again through `prepack`; this build is for the check below.
      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: bun run build

      # The same check `prepack` runs, so a version number is never burnt on a
      # package whose exports point at missing files or the wrong kind of file.
      - name: The package carries its entry points
        if: steps.version.outputs.skip != 'true'
        run: node scripts/check-exports.ts

      # Two preconditions of trusted publishing, checked before anything is
      # published: the OIDC endpoint exists only on GitHub-hosted runners, and the
      # CLI has to be new enough to use it.
      - name: Check trusted publishing preconditions
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC endpoint. Trusted publishing needs a GitHub-hosted runner and 'id-token: write'."
            exit 1
          fi

          npm install -g 'npm@^11.5.1'
          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`npm ${process.argv[1]} cannot use trusted publishing; it needs >= 11.5.1.`);
              process.exit(1);
            }
          ' "$NPM_VERSION"

      # A re-run after a publish whose tag step failed must still finish: the
      # version is on the registry, so skip the publish and write the tag.
      # Reading a public package needs no credential.
      - name: Is this version already published?
        if: steps.version.outputs.skip != 'true'
        id: registry
        shell: bash
        run: |
          set -euo pipefail

          if npm view "${PACKAGE}@${{ steps.version.outputs.version }}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE}@${{ steps.version.outputs.version }} is already on the registry; tagging only."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # No auth token and no provenance flag: with trusted publishing the CLI
      # authenticates through OIDC and attaches provenance by default. Without a
      # trusted publisher npm exits ENEEDAUTH, which reads like a missing secret;
      # there is no secret by design, so translate it.
      - name: Publish
        if: steps.version.outputs.skip != 'true' && steps.registry.outputs.published != 'true'
        shell: bash
        run: |
          set -uo pipefail

          LOG="$(mktemp)"
          STATUS=0
          npm publish --access public --tag "${{ steps.version.outputs.dist-tag }}" 2>&1 | tee "$LOG" || STATUS=$?

          if [ "$STATUS" -ne 0 ] && grep -q 'ENEEDAUTH' "$LOG"; then
            echo "::error::npm found no publish-capable trusted publisher for this workflow. Add one with 'Allow npm publish' ticked: npm trust github @purview-dev/pm-docs-site --repo purview-dev/pm-skills --file publish-pm-docs-site.yml --allow-publish. Check with: npm trust list @purview-dev/pm-docs-site"
          fi

          exit "$STATUS"

      # A package always has a `latest` tag (the registry refuses to delete it),
      # so while no stable version exists it points at the newest prerelease.
      # Once a stable release exists, its publish owns `latest` and this step
      # stands down. Moving a tag needs the "Allow npm dist-tag" permission on
      # the trusted publisher, so a missing grant warns and never fails a release.
      - name: Keep latest on the newest prerelease
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          set -uo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          CURRENT="$(npm view "${PACKAGE}" dist-tags.latest 2>/dev/null || true)"
          echo "version released: ${VERSION}"
          echo "latest is currently: ${CURRENT:-(none)}"

          case "${VERSION}" in
            *-*)
              case "${CURRENT}" in
                '' | *-*)
                  echo "No stable release yet; pointing latest at ${VERSION}."
                  npm dist-tag add "@purview-dev/pm-docs-site@$VERSION" latest ||
                    echo "::warning::Could not move latest to ${VERSION}. Grant the 'Allow npm dist-tag' permission to the trusted publisher, or run: npm dist-tag add @purview-dev/pm-docs-site@${VERSION} latest"
                  ;;
                *)
                  echo "latest is the stable ${CURRENT}; leaving it alone."
                  ;;
              esac
              ;;
            *)
              echo "${VERSION} is stable, so publishing already set latest."
              ;;
          esac

      # The tag is written only after a successful publish, so a failed publish
      # never leaves a tag that would make the next run skip a version nobody can
      # install. Never the repository's latest release: that is the skills' v{version}.
      - name: Tag and GitHub release
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          prerelease=()
          if [[ "${VERSION}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${PACKAGE} ${VERSION}" \
            --notes "Published to npm: https://www.npmjs.com/package/${PACKAGE}/v/${VERSION}" \
            --latest=false "${prerelease[@]}"
