name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Mirrors `just validate`: frontmatter, README, managed-section, setup
      # inventory, markers, and template placeholders.
      - name: Validate skills
        run: bun scripts/validate.ts

      # Mirrors `just test`: the version scripts, pm-export's exporter and pm-lint against their fixtures, pm-help's context report, and pm-next's PM branch sync.
      - name: Test scripts
        run: bun test scripts/ skills/pm-export/ skills/pm-help/ skills/pm-lint/ skills/pm-next/

      # Mirrors `just pm-lint`: planning/ against the PM file format rules.
      - name: Lint PM state
        run: bun skills/pm-lint/scripts/lint.ts check

      # Mirrors `just lint-check`: markdownlint-cli2 with the repository config.
      - name: Lint Markdown
        run: bunx markdownlint-cli2 "**/*.md" "#node_modules"

  # Mirrors `just docs-check`: the repository's own pm-docs-site site, built
  # from planning/planning.json. A template change that breaks a consumer's
  # site breaks this one first.
  docs-site:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Match the pm-docs-site templates
        run: bun ../skills/pm-docs-site/scripts/site.ts check .

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Type-check
        run: bun run check

      - name: Build
        run: bun run build

  # Mirrors `just package-test`: the pm-docs-site package (on npm as a
  # prerelease). Its tests build sites with the CLI under Node, as a consumer
  # would, including one from the packed tarball installed outside the repo.
  pm-docs-site-package:
    name: pm-docs-site package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/pm-docs-site
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Type-check
        run: bun run check

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: bun run test:browser

      - name: Dev browser tests
        run: bun run test:browser:dev

      # Mirrors `just demo-check`: the demo site (examples/demo) builds with
      # every view filled. Run from the repository root.
      - name: Demo export is current
        working-directory: ${{ github.workspace }}
        run: bun skills/pm-export/scripts/export.ts check --root examples/demo --pm-root planning/

      - name: Demo export is valid
        working-directory: ${{ github.workspace }}
        run: bun skills/pm-export/scripts/export.ts validate examples/demo/planning/planning.json

      - name: Demo PM files lint
        working-directory: ${{ github.workspace }}
        run: bun skills/pm-lint/scripts/lint.ts check --root examples/demo --pm-root planning/

      - name: Build the package
        run: node scripts/build.ts

      - name: Install the demo
        working-directory: ${{ github.workspace }}/examples/demo
        run: bun install --frozen-lockfile

      - name: Build the demo
        working-directory: ${{ github.workspace }}/examples/demo
        run: bun run build

      - name: Demo pages have content
        working-directory: ${{ github.workspace }}
        run: bun scripts/check-demo.ts

      - name: Demo build is reproducible
        run: node scripts/check-reproducible.ts ../../examples/demo

  # Mirrors `just version-check` (the lefthook pre-push hook): a skills change
  # ships in a release, so it must raise the rules version and package.json
  # past the version on main; anything else (docs, CI, scripts, package
  # metadata) merges on the same rules version. The validate job keeps
  # package.json's major, planning/config.md, and AGENTS.md on the rules
  # version, so this repository runs the release it ships.
  # Scoped to pull requests: on main the release tag already exists.
  version:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check the version against main
        run: bun scripts/check-version.ts "${{ github.event.pull_request.base.sha }}"
